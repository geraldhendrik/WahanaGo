<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/output.css">
    <title>WahanaGo - Tiket Wahana </title>
</head>
<body class="bg-gray-50">
    <!-- APPBAR -->
    <header class="sticky top-0 z-50 border-b border-gray-200 bg-white">
        <nav class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">

            <!-- Logo -->
            <a href="#" class="text-2xl font-bold tracking-tight text-slate-900">
                Wahana<span class="text-[var(--1)]-500">Go</span>
            </a>

            <!-- Menu -->
            <div class="hidden items-center gap-8 md:flex">
                <a href="#" class="font-medium text-[var(--1)]-500">
                    Beranda
                </a>

                <a href="#wahana" class="text-gray-600 transition hover:text-[var(--1)]-500">
                    Jelajahi Wahana
                </a>

                <a href="#tiket" class="text-gray-600 transition hover:text-[var(--1)]-500">
                    Tiket Saya
                </a>
            </div>

            <!-- Tombol Masuk -->
            <a href="#login"
               class="rounded-xl bg-[var(--1)] px-5 py-2.5 font-semibold text-white transition hover:bg-[var(--2)]">
                Masuk
            </a>

        </nav>
    </header>

    
<!-- Beranda -->
<main>
    
    <section class="hero-section">
        <div class="hero-content">
            <h1>Temukan Petualangan Serumu Disini!</h1>

        <div class="hero-action">
            <h2>Jelajahi berbagai wahana menarik bersama WahanaGo</h2>

            <a href="#wahana" class="btn-jelajahi">
            Jelajahi Wahana <span>→</span>
            </a>

        </div>
        </div>
    </section>

</main>

<!-- Jelajahi Wahana -->
<section id="wahana" class="wahana-section">
    <div class="wahana-header">
        <h2>Jelajahi Wahana</h2>
        <p>Temukan berbagai wahana menarik yang dapat anda nimati</p>
    </div>

    <div
        <div id="daftar-wahana" 
        class="daftar-wahana">
    >
        Memuat daftar wahana...
    </div>
    
</section>

    <script>
    async function ambilWahana() {
        const daftarWahana = document.getElementById('daftar-wahana');

        try {
            const response = await fetch(
                'http://127.0.0.1:8000/api/wahana'
            );

            if (!response.ok) {
                throw new Error('Gagal mengambil data wahana');
            }

            const wahana = await response.json();

            daftarWahana.innerHTML = '';

            wahana.forEach(item => {
                const kartu = document.createElement('div');

                kartu.className = 'kartu-wahana';

                kartu.innerHTML = `
                    <span class="kategori-wahana">
                        ${item.kategori}
                    </span>

                    <h3>${item.nama}</h3>

                    <p class="harga-wahana">
                        Rp${item.harga.toLocaleString('id-ID')}
                    </p>
                `;

                daftarWahana.appendChild(kartu);
            });

        } catch (error) {
            console.error('Terjadi kesalahan:', error);
            daftarWahana.textContent =
                'Gagal memuat wahana. Periksa koneksi ke server.';
        }
    }

    ambilWahana();
    </script>

</body>
</html>
